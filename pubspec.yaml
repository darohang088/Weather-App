name: weather_app
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8
  go_router: ^17.0.0
  provider: ^6.1.5+1
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design:
    true

    # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/

  fonts:
    - family: NotoSansKhmer
      fonts:
        - asset: assets/fonts/KantumruyPro-VariableFont_wght.ttf
