                          <DollarSign className="w-8 h-8 text-orange-600 mx-auto mb-2" />
                          <p className="font-medium">{getText('Cash', 'សាច់ប្រាក់')}</p>
                          <p className="text-xs text-gray-500">Pay at office</p>
                        </button>
                      </div>
                    </div>

                    {/* Payment History */}
                    <div className="bg-white rounded-lg shadow p-6">
                      <h3 className="text-lg font-semibold mb-4">{getText('Payment History', 'ប្រវត្តិការបង់ប្រាក់')}</h3>
                      <div className="overflow-x-auto">
                        <table className="w-full">
                          <thead className="bg-gray-50">
                            <tr>
                              <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{getText('Type', 'ប្រភេទ')}</th>
                              <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{getText('Amount', 'ចំនួន')}</th>
                              <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{getText('Method', 'វិធី')}</th>
                              <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{getText('Date', 'កាលបរិច្ឆេទ')}</th>
                              <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{getText('Status', 'ស្ថានភាព')}</th>
                              <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{getText('Receipt', 'បង្កាន់ដៃ')}</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-gray-200">
                            {payments.filter(p => p.tenantId === currentUser.tenantId).map(payment => (
                              <tr key={payment.id}>
                                <td className="px-4 py-3 capitalize text-gray-900">{payment.type}</td>
                                <td className="px-4 py-3 font-bold text-gray-900">{formatCurrency(payment.amount)}</td>
                                <td className="px-4 py-3 text-gray-600">{payment.method || '-'}</td>
                                <td className="px-4 py-3 text-gray-600">{payment.date}</td>
                                <td className="px-4 py-3">
                                  <span className={'px-3 py-1 rounded-full text-sm font-medium ' + (payment.status === 'paid' ? 'bg-green-100 text-green-800' : 'bg-orange-100 text-orange-800')}>
                                    {payment.status}
                                  </span>
                                </td>
                                <td className="px-4 py-3">
                                  {payment.status === 'paid' && (
                                    <button className="text-blue-600 hover:text-blue-800">
                                      <Download className="w-4 h-4" />
                                    </button>
                                  )}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {/* Stayer Services Tab */}
                {userRole === 'stayer' && activeTab === 'maintenance' && (
                  <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">{getText('Services & Maintenance', 'សេវាកម្ម និងការថែទាំ')}</h2>

                    {/* Service Request Options */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <button className="bg-white rounded-lg shadow p-6 hover:shadow-lg transition-shadow">
                        <Wrench className="w-8 h-8 text-orange-500 mb-2" />
                        <h3 className="font-semibold">{getText('Maintenance', 'ការជួសជុល')}</h3>
                        <p className="text-sm text-gray-600 mt-1">Report issues</p>
                      </button>
                      <button className="bg-white rounded-lg shadow p-6 hover:shadow-lg transition-shadow">
                        <Package className="w-8 h-8 text-blue-500 mb-2" />
                        <h3 className="font-semibold">{getText('Cleaning', 'សម្អាត')}</h3>
                        <p className="text-sm text-gray-600 mt-1">Request service</p>
                      </button>
                      <button className="bg-white rounded-lg shadow p-6 hover:shadow-lg transition-shadow">
                        <Key className="w-8 h-8 text-green-500 mb-2" />
                        <h3 className="font-semibold">{getText('Extra Key', 'សោបន្ថែម')}</h3>
                        <p className="text-sm text-gray-600 mt-1">Request duplicate</p>
                      </button>
                    </div>

                    {/* My Requests */}
                    <div className="bg-white rounded-lg shadow p-6">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg font-semibold">{getText('My Requests', 'សំណើររបស់ខ្ញុំ')}</h3>
                        <button className="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg flex items-center">
                          <Plus className="w-4 h-4 mr-2" />
                          {getText('New Request', 'សំណើថ្មី')}
                        </button>
                      </div>
                      
                      <div className="grid grid-cols-1 gap-4">
                        {maintenanceRequests.filter(r => r.tenantId === currentUser.tenantId).map(request => (
                          <div key={request.id} className="border rounded-lg p-4">
                            <div className="flex justify-between items-start mb-2">
                              <div>
                                <h4 className="font-semibold text-gray-800">{request.issue}</h4>
                                <p className="text-sm text-gray-600">{request.date}</p>
                              </div>
                              <span className={'px-3 py-1 rounded-full text-xs font-semibold ' + (
                                request.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :
                                request.status === 'in-progress' ? 'bg-blue-100 text-blue-800' :
                                'bg-green-100 text-green-800'
                              )}>
                                {request.status}
                              </span>
                            </div>
                            <p className="text-sm text-gray-700">{request.description}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* Stayer Documents Tab */}
                {userRole === 'stayer' && activeTab === 'documents' && (
                  <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">{getText('My Documents', 'ឯកសាររបស់ខ្ញុំ')}</h2>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                      <div className="bg-white rounded-lg shadow p-6 hover:shadow-lg transition-shadow cursor-pointer">
                        <FileText className="w-8 h-8 text-blue-500 mb-2" />
                        <h3 className="font-semibold">{getText('Rental Contract', 'កិច្ចសន្យាជួល')}</h3>
                        <p className="text-sm text-gray-600 mt-1">Valid until {tenants.find(t => t.id === currentUser.tenantId)?.endDate}</p>
                        <button className="text-blue-600 text-sm mt-2 hover:underline">
                          <Download className="w-4 h-4 inline mr-1" />
                          {getText('Download', 'ទាញយក')}
                        </button>
                      </div>
                      
                      <div className="bg-white rounded-lg shadow p-6 hover:shadow-lg transition-shadow cursor-pointer">
                        <Shield className="w-8 h-8 text-green-500 mb-2" />
                        <h3 className="font-semibold">{getText('House Rules', 'ច្បាប់ផ្ទះ')}</h3>
                        <p className="text-sm text-gray-600 mt-1">Building regulations</p>
                        <button className="text-blue-600 text-sm mt-2 hover:underline">
                          <Download className="w-4 h-4 inline mr-1" />
                          {getText('Download', 'ទាញយក')}
                        </button>
                      </div>
                      
                      <div className="bg-white rounded-lg shadow p-6 hover:shadow-lg transition-shadow cursor-pointer">
                        <DollarSign className="w-8 h-8 text-purple-500 mb-2" />
                        <h3 className="font-semibold">{getText('Payment History', 'ប្រវត្តិបង់ប្រាក់')}</h3>
                        <p className="text-sm text-gray-600 mt-1">All transactions</p>
                        <button className="text-blue-600 text-sm mt-2 hover:underline">
                          <Download className="w-4 h-4 inline mr-1" />
                          {getText('Download', 'ទាញយក')}
                        </button>
                      </div>
                      
                      <div className="bg-white rounded-lg shadow p-6 hover:shadow-lg transition-shadow cursor-pointer">
                        <AlertCircle className="w-8 h-8 text-red-500 mb-2" />
                        <h3 className="font-semibold">{getText('Emergency Contacts', 'ទំនាក់ទំនងបន្ទាន់')}</h3>
                        <p className="text-sm text-gray-600 mt-1">Important numbers</p>
                        <button className="text-blue-600 text-sm mt-2 hover:underline">
                          <Download className="w-4 h-4 inline mr-1" />
                          {getText('View', 'មើល')}
                        </button>
                      </div>
                    </div>

                    {/* Emergency Contacts */}
                    <div className="bg-red-50 border border-red-200 rounded-lg p-6">
                      <h3 className="font-semibold text-red-900 mb-3 flex items-center">
                        <AlertCircle className="w-5 h-5 mr-2" />
                        {getText('Emergency Contacts', 'ទំនាក់ទំនងបន្ទាន់')}
                      </h3>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                        <div>
                          <p className="font-medium text-red-800">Building Manager</p>
                          <p className="text-red-700">012-345-678</p>
                        </div>
                        <div>
                          <p className="font-medium text-red-800">Security</p>
                          <p className="text-red-700">098-765-432</p>
                        </div>
                        <div>
                          <p className="font-medium text-red-800">Maintenance</p>
                          <p className="text-red-700">070-123-456</p>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* Modals */}
              <NotificationsModal />
              <MessagesModal />
              <QRPaymentModal />
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StayEaseApp />);
    </script>
</body>
</html>
