name: Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Rename APK files
        run: |
          TAG=${{ steps.tag.outputs.TAG_NAME }}
          cd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk weather-app-${TAG}-arm64-v8a.apk || true
          mv app-armeabi-v7a-release.apk weather-app-${TAG}-armeabi-v7a.apk || true
          mv app-x86_64-release.apk weather-app-${TAG}-x86_64.apk || true
          mv app-release.apk weather-app-${TAG}-universal.apk || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/weather-app-*.apk
            build/app/outputs/bundle/release/app-release.aab
          body: |
            ## Release ${{ steps.tag.outputs.TAG_NAME }}

            ### Downloads
            - **ARM64 APK** - Recommended for modern devices
            - **Universal APK** - Works on all devices
            - **App Bundle** - For Google Play Store

            Built with Flutter 3.24.0
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
