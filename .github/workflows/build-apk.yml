# =============================================================================
# RELEASE BUILD WORKFLOW
# Automatically builds and releases APK when you push a git tag (e.g., v1.0.0)
# =============================================================================

name: Release Build

# Trigger: Runs when you push a tag starting with "v" (like v1.0.0, v2.1.3)
on:
  push:
    tags:
      - "v*"

# Permission: Allows workflow to create GitHub releases
permissions:
  contents: write

jobs:
  release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # =========================================================================
      # SETUP SECTION - Prepare the build environment
      # =========================================================================

      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Get tag version
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: 📱 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: "stable"
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      # =========================================================================
      # QUALITY CHECKS - Analyze and test the code
      # =========================================================================

      - name: 🔍 Run code analysis
        run: flutter analyze
        continue-on-error: true # Don't fail build if there are warnings

      - name: 🧪 Run tests
        run: flutter test
        continue-on-error: true # Don't fail build if tests fail

      # =========================================================================
      # BUILD SECTION - Create APK and App Bundle
      # =========================================================================

      - name: 🔨 Build APK (Split by architecture)
        run: flutter build apk --release --split-per-abi

      - name: 📦 Build App Bundle (for Play Store)
        run: flutter build appbundle --release

      # =========================================================================
      # PREPARE ARTIFACTS - Rename files with version number
      # =========================================================================

      - name: 🏷️ Rename APK files with version
        run: |
          VERSION=${{ steps.tag.outputs.TAG_NAME }}
          cd build/app/outputs/flutter-apk/

          # Rename each APK with version number
          [ -f app-arm64-v8a-release.apk ] && mv app-arm64-v8a-release.apk weather-app-${VERSION}-arm64-v8a.apk
          [ -f app-armeabi-v7a-release.apk ] && mv app-armeabi-v7a-release.apk weather-app-${VERSION}-armeabi-v7a.apk
          [ -f app-x86_64-release.apk ] && mv app-x86_64-release.apk weather-app-${VERSION}-x86_64.apk
          [ -f app-release.apk ] && mv app-release.apk weather-app-${VERSION}-universal.apk

          # Show renamed files
          echo "✅ APK files ready:"
          ls -lh *.apk

      # =========================================================================
      # RELEASE SECTION - Create GitHub release and upload files
      # =========================================================================

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/weather-app-*.apk
            build/app/outputs/bundle/release/app-release.aab
          body: |
            ## 🎉 Weather App ${{ steps.tag.outputs.TAG_NAME }}

            ### 📱 Download APK

            **Recommended for most users:**
            - `weather-app-${{ steps.tag.outputs.TAG_NAME }}-arm64-v8a.apk` (~27 MB)
              - For modern Android devices (2017 and newer)
              - Smallest file size

            **Alternative downloads:**
            - `weather-app-${{ steps.tag.outputs.TAG_NAME }}-armeabi-v7a.apk` (~25 MB)
              - For older Android devices (2014-2017)

            - `weather-app-${{ steps.tag.outputs.TAG_NAME }}-universal.apk` (~85 MB)
              - Works on ALL Android devices
              - Larger file size

            - `weather-app-${{ steps.tag.outputs.TAG_NAME }}-x86_64.apk` (~30 MB)
              - For Android emulators

            ### 🏪 For Developers
            - `app-release.aab` - App Bundle for Google Play Store upload

            ### 📋 Installation Instructions
            1. Download the recommended ARM64 APK above
            2. Open the downloaded file on your Android device
            3. Allow installation from unknown sources if prompted
            4. Install and enjoy!

            ### ℹ️ Build Information
            - **Flutter Version:** 3.24.0
            - **Built on:** ${{ github.event.head_commit.timestamp }}
            - **Commit:** ${{ github.sha }}
          draft: false
          prerelease: false

      # =========================================================================
      # ARTIFACTS SECTION - Upload to GitHub Actions (backup)
      # =========================================================================

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.tag.outputs.TAG_NAME }}
          path: |
            build/app/outputs/flutter-apk/weather-app-*.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      # =========================================================================
      # SUMMARY - Show build results
      # =========================================================================

      - name: 📊 Generate build summary
        if: always()
        run: |
          echo "## 🎉 Release Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Version: \`${{ steps.tag.outputs.TAG_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- [📥 Download Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.TAG_NAME }})" >> $GITHUB_STEP_SUMMARY
          echo "- [📋 View All Releases](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Build Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
